name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          version: 11.9.0
          runtime: node@24
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
